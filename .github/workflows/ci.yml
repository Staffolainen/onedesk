name: CI

# Fast feedback on pull requests and pushes to non-main branches.
# No secrets, no infra — just tests and an image-build sanity check.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    # Verify the Docker image builds; do not push anything.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg BUILD_TIME="ci-${{ github.sha }}" -t onedesk:ci .
