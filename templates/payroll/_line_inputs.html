<td style="padding:4px 6px;">
  <select name="salary_type_id" class="form-control" style="font-size:13px;padding:4px 6px;min-width:190px;" onchange="onType(this)">
    <option value="">—</option>
    {% for t in salary_types %}
    <option value="{{ t.id }}" {% if st and st.id == t.id %}selected{% endif %}>{{ t.code }} {{ t.name }}{% if kinds[t.kind][0] < 0 %} (−){% endif %}</option>
    {% endfor %}
  </select>
</td>
<td style="padding:4px 6px;"><input type="text" name="description" class="form-control" style="font-size:13px;padding:4px 6px;" value="{{ line.description if line else '' }}"></td>
<td style="padding:4px 6px;white-space:nowrap;"><input type="text" inputmode="decimal" name="quantity" class="form-control mono" style="font-size:13px;padding:4px 6px;width:70px;text-align:right;display:inline-block;" value="{{ line.quantity if line and line.quantity is not none else '' }}" oninput="recalc(this)"> <span class="unit" style="font-size:11px;color:var(--muted);">{{ st.unit if st and st.unit else '' }}</span></td>
<td style="padding:4px 6px;"><input type="text" inputmode="decimal" name="rate" class="form-control mono" style="font-size:13px;padding:4px 6px;width:90px;text-align:right;" value="{{ line.rate if line and line.rate is not none else '' }}" oninput="recalc(this)"></td>
<td style="padding:4px 6px;"><input type="text" inputmode="decimal" name="amount" class="form-control mono" style="font-size:13px;padding:4px 6px;width:110px;text-align:right;" value="{{ '%.2f'|format(line.amount) if line else '' }}"></td>
<td style="padding:4px 6px;"><button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('tr').remove()" title="{{ 'Ta bort rad' if g.lang == 'sv' else 'Remove row' }}">✕</button></td>
